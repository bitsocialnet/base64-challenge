name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11. npm 10 crashes on this package's peer dependency set (see AGENTS.md).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
