name: Publish @bitsocial/base64-challenge to npm

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - package.json

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - id: package
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          echo "name=$package_name" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

          # Skip only when the registry confirms this exact version. Any other result, a registry error
          # included, goes on to npm publish, which fails the run instead of skipping the release.
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "$package_name@$package_version is already published."
          else
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "$package_name@$package_version will be published."
          fi

      - run: npm publish --access public --provenance
        if: steps.package.outputs.publish == 'true'
